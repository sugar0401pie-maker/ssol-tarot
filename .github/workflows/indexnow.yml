# 운영(production) 배포가 성공한 뒤에만 바뀐 페이지를 IndexNow(Bing·네이버 등)에 알립니다.
# 프리뷰 배포에서는 실행되지 않고, 실패해도 배포에 영향이 없습니다(스크립트는 항상 종료 코드 0).
# INDEXNOW_KEY(Secret)·SITE_URL(Variable)을 저장소 설정에 등록하면 그 값을 쓰고, 없으면 아래 기본값을 씁니다(키는 /7ce312c4077776e12efcfc8288580b9e.txt 로 공개되는 값입니다).
name: IndexNow

on:
  deployment_status:

permissions:
  contents: read

jobs:
  indexnow:
    if: github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Submit changed pages to IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY || '7ce312c4077776e12efcfc8288580b9e' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://tarot.ssolwellnesshouse.com' }}
