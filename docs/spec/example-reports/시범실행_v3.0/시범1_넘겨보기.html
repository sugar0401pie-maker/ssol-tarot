<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>쏠 타로 결과 넘겨 보기</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--night:#012F53;--night-deep:#001E38;--gold:#E3C68E;--gold-soft:#F3E2BE;--moon:#FCEFD4;--cream:#FEF3DE;--line:#204870;--ink:#1C2B3A;--muted:#5a6470;--bg:#E9E4DA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1620}}
:root[data-theme="dark"]{--bg:#0b1620}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px}
.top{max-width:430px;width:100%;text-align:center;margin-bottom:12px;color:var(--muted);font-size:13px;line-height:1.6}
.top b{font-family:'Gowun Batang',serif;color:var(--line);font-size:18px;display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .top{color:#b9c3cc}:root:not([data-theme="light"]) .top b{color:var(--gold-soft)}}
.phone{width:100%;max-width:400px;height:min(780px,calc(100vh - 120px));min-height:560px;border:8px solid #161616;border-radius:34px;overflow:hidden;background:var(--cream);position:relative;display:flex;flex-direction:column}
.dots{display:flex;gap:6px;justify-content:center;padding:10px 0 6px;background:var(--cream);border-bottom:1px solid #20487018}
.dots i{width:7px;height:7px;border-radius:50%;background:#20487033;transition:all .25s}
.dots i.on{width:20px;border-radius:4px;background:var(--line)}
.dots i.lock{background:#b8a77a66}
.dots i.lock.on{background:#b8a77a}
.rail{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;padding:0 0 90px}
.ph{position:sticky;top:0;z-index:2;background:linear-gradient(var(--cream) 80%,#fef3de00);padding:14px 18px 10px;display:flex;align-items:center;gap:8px}
.ph h1{font-family:'Gowun Batang',serif;font-size:16px;color:var(--line);flex:1;line-height:1.35;word-break:keep-all}
.ph .no{font-size:11px;color:var(--muted);min-width:32px}
.acc{font-size:10px;padding:2px 7px;border-radius:9px;white-space:nowrap}
.acc-free{background:#d8ead3;color:#2f5b2a}.acc-part{background:#f5e3b9;color:#7a5a12}.acc-paid{background:var(--night);color:var(--gold-soft)}
.pbody{padding:2px 18px 10px;font-size:14px;line-height:1.75}
.pbody p{margin:0 0 10px;word-break:keep-all}
.pbody h4{font-family:'Gowun Batang',serif;color:var(--line);font-size:14.5px;margin:18px 0 6px;padding-top:12px;border-top:1px dashed #20487033}
.pbody ul{margin:0 0 10px 18px}.pbody li{margin-bottom:6px;word-break:keep-all}
.strip{display:flex;gap:8px;margin:4px 0 2px}
.card{margin:0;position:relative;border-radius:10px;overflow:hidden;box-shadow:0 6px 16px #01223f40;background:#fff;cursor:zoom-in}
.card img{display:block;width:100%}
.card figcaption{font-family:'Gowun Batang',serif;font-weight:700;color:var(--line);font-size:11px;text-align:center;padding:4px 2px 6px;background:var(--cream)}
.card .rev{display:block;font-style:normal;font-size:9.5px;color:#9a7b3a;font-family:'Noto Sans KR',sans-serif;font-weight:500}
.card.sm{flex:1}.card.md{width:96px;flex:0 0 96px}
.hint{text-align:center;font-size:11px;color:var(--muted);margin:6px 0 14px!important}
.mini{margin-top:6px;padding-top:10px;border-top:1px dashed #20487033}
.mini .pos{display:inline-block;font-size:10.5px;background:var(--night);color:var(--gold-soft);padding:1px 8px;border-radius:9px;margin-right:6px;vertical-align:2px}
.mini b{font-family:'Gowun Batang',serif;color:var(--line);font-size:15.5px}.mini small{color:var(--muted)}
.kw{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 6px!important}
.kw span{font-size:11.5px;background:#fff;border:1px solid var(--gold);color:#7a5a12;border-radius:12px;padding:1px 9px}
.cardhead{display:flex;gap:14px;align-items:center;margin:4px 0 10px}
.cardhead .pos{font-size:11px;color:#9a7b3a;margin:0!important}
.cardhead h3{font-family:'Gowun Batang',serif;color:var(--line);font-size:21px;line-height:1.3}
.cardhead .ch{color:var(--muted);font-size:12.5px;margin:2px 0 0!important}
.core{font-family:'Gowun Batang',serif;font-size:15.5px;color:var(--line);background:transparent;border-left:3px solid var(--gold);padding:10px 12px;border-radius:0 10px 10px 0}
.card.xl{width:100%;margin:2px 0 14px;border-radius:14px}
.card .revtag{font-size:9.5px;color:#9a7b3a;text-align:center;padding:3px 0 4px;background:var(--cream)}
.cardinfo{border-left:3px solid var(--gold);padding:4px 0 4px 12px;margin:0 0 6px;background:transparent}
.cardinfo .pos{font-size:11.5px;color:#9a7b3a;margin:0 0 2px!important}
.cardinfo .cname,.cardinfo .cmsg{font-family:'Gowun Batang',serif;font-size:17px;color:var(--line);line-height:1.5;margin:0!important}
.cardinfo .cname .ch{font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--muted)}
.storyhead{font-family:'Gowun Batang',serif;font-size:19px;color:var(--line);margin:22px 0 4px;padding-top:14px;border-top:1px dashed #20487033}
ul.plain li{font-weight:400}
.headline{font-family:'Gowun Batang',serif;font-size:22px;line-height:1.45;color:var(--line);text-align:center;margin:18px 2px 14px;word-break:keep-all}
.btn{display:block;width:100%;border:0;border-radius:24px;padding:13px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;margin:10px 0}
.btn.fill{background:var(--night);color:var(--moon)}
.btn.line{background:transparent;color:var(--line);border:1.5px solid var(--line)}
.navrow{display:flex;gap:8px;align-items:center;margin-top:22px}.navrow .btn{margin:0}.navrow .btn.line{flex:0 0 32%;font-size:13px;padding:11px 0}.navrow .btn.fill{flex:1}
.pbody p b{color:var(--line)}
.fold{margin:18px 0 6px;border:1.5px solid #20487030;border-radius:14px;padding:4px 14px;background:#fff8ea}
.fold summary{cursor:pointer;font-weight:700;color:var(--line);padding:10px 0;list-style:none}.fold summary::after{content:" ▾";color:var(--gold)}.fold[open] summary::after{content:" ▴"}
.fold summary::-webkit-details-marker{display:none}
.sec{font-family:'Gowun Batang',serif;font-size:17px;color:var(--line);margin:26px 0 6px;padding-top:16px;border-top:1px dashed #20487040}
.bridge{margin:20px 0 2px!important;font-weight:700;color:var(--night);font-size:15px;line-height:1.5}.bridge::before{content:"↳ ";color:var(--gold)}
.cardinfo .arc{font-size:11.5px;color:var(--muted);margin:2px 0 0!important}
.cardmini{margin:18px 0 4px;font-weight:700;color:var(--night);font-size:14px}.cardmini::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-right:7px;vertical-align:middle}
.sum{font-size:16px;line-height:1.6;color:var(--line);margin:4px 0 12px;padding-left:10px;border-left:3px solid var(--gold)}
.sum b{font-weight:700}
.lockwrap{position:relative;margin-top:6px}
.blurred{filter:blur(5px);opacity:.75;user-select:none;pointer-events:none;max-height:340px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 40%,transparent)}
.pay{position:relative;margin-top:-140px;background:var(--night);color:var(--moon);border-radius:18px;padding:18px 16px 12px;text-align:center;box-shadow:0 10px 30px #01223f55}
.pay::before{content:"";position:absolute;inset:6px;border:1px solid var(--gold);border-radius:13px;opacity:.5;pointer-events:none}
.pay b{font-family:'Gowun Batang',serif;font-size:16px;color:var(--gold-soft);display:block;margin-bottom:6px}
.pay p{font-size:12.5px;line-height:1.6;color:var(--moon)!important}.pay .price{font-weight:700;color:var(--gold)!important;margin-top:4px!important}
.pay .btn{background:var(--gold);color:var(--night)}.pay small{display:block;font-size:10.5px;opacity:.7}
.teaser{font-family:'Gowun Batang',serif;color:var(--line);font-size:15px;text-align:center;margin:20px 0 10px!important}
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px 14px;background:linear-gradient(#fef3de00,var(--cream) 40%)}
.nav button{border:1px solid #20487040;background:#fff;color:var(--line);width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer}
.nav button:disabled{opacity:.3;cursor:default}
.nav span{font-size:12px;color:var(--muted)}
.state{display:flex;gap:6px;justify-content:center;margin-top:12px}
.state button{font:inherit;font-size:12px;border:1px solid #20487055;background:#fff;color:var(--line);border-radius:14px;padding:5px 12px;cursor:pointer}
.state button.on{background:var(--night);color:var(--moon)}
.zoom{position:fixed;inset:0;background:#001E38c4;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9}
.zoom.on{opacity:1;pointer-events:auto}
.zoom img{width:min(70vw,300px);border-radius:14px;box-shadow:0 20px 50px #000a;transform:scale(.6) rotate(-4deg);transition:transform .45s cubic-bezier(.22,.8,.24,1)}
.zoom.on img{transform:none}
@media (prefers-reduced-motion: reduce){.rail{scroll-behavior:auto}.zoom img{transition:none}}
</style>

ss="kw"><span>#통제</span><span>#경직</span><span>#긴장</span><span>#혼자 짊어짐</span></p><p class="arc">원래 타로 카드 · 황제(The Emperor)</p></div><h3 class="storyhead">이 고민이 생기기까지, 나는 어떻게 해 왔을까?</h3><p><b>그동안 불안할 때마다 계획을 더 촘촘히 세우고 모든 걸 내 손으로 관리해 왔을 수 있어요.</b> 그 덕분에 일은 흐트러지지 않았지만, 몸과 마음은 늘 긴장한 채였습니다.</p>

이 순간</span></p><p class="arc">원래 타로 카드 · 태양(The Sun)</p></div><h3 class="storyhead">더 나은 앞으로를 위해, 무엇에 마음을 두면 될까?</h3><p><b>앞으로는 좋은 순간을 충분히 누리는 데 마음을 두세요.</b> 물개가 햇살 바위에서 쉬듯 기쁨을 느긋하게 즐기면 고민을 마주할 기운도 다시 채워집니다.</p>
<p>상대의 답보다 이 연락이 나에게 어떤 기쁨이었는지가 이 고민의 열쇠예요.</p>
<p>이제 세 장을 함께 읽어 볼까요?</p><div class="navrow"><button class="btn line go-prev">돌아가기</button><button class="btn fill go-next">세 장 함께 읽기 →</button></div></div></section>
<section class="page" data-page="5"><header class="ph"><span class="no">5 / 10</span><h1>세 장이 함께 들려주는 이야기</h1></header><div class="pbody"><h2 class="headline">되짚어 온 시간을 지나,<br>내가 누린 설렘 쪽으로</h2>
<p>지윤님의 마음은 멈춘 대화를 지나간 말들로 자꾸 되감으며, 답을 기다리는 시간을 길게 붙들고 있을 수 있어요.</p><div class="lockwrap"><div class="blurred"><p class="sum"><b>세 장은 불안을 붙잡아 온 날들에서 내 기쁨을 지키는 쪽으로 가는 길을 짚어 줘요.</b></p>
<p>그동안 불안할 때마다 계획을 더 세우고 모든 걸 붙잡아 왔을 수 있어요. 그 방식이 쌓여 이번에도 대화가 멈추자 마지막 말을 되짚으며 마음이 쉽게 흔들리고, 쉬어도 풀리지 않는 긴장이 이어지고 있습니다. 그래서 앞으로의 열쇠는 상대의 답을 붙잡는 힘보다, 이 설렘 속에서 나를 쉬게 하는 기쁨 쪽이 될 수 있습니다.</p>

<section class="page" data-page="6"><header class="ph"><span class="no">6 / 10</span><h1>내 고민에 대어 보면</h1></header><div class="pbody"><p class="teaser">세 자리를 내 고민 속 장면에 하나씩 대어 본 분석</p><div class="lockwrap"><div class="blurred"><p class="sum"><b>이 고민은 해결책을 찾기보다 바닥난 힘을 채우는 일이 먼저예요.</b></p>
<p>퇴근 후에도 업무 생각이 꺼지지 않고, 주말이 지나도 몸이 무거운 상태가 이어지는 모습입니다. 지금은 해결책을 찾기보다 바닥난 에너지를 먼저 채워야 일의 매듭도 보이기 시작해요. 이번 주 사흘 동안 퇴근 후 첫 30분은 업무 메신저와 메일을 열지 않는 시간으로 정해 보세요. 그 시간에는 샤워나 산책처럼 몸이 쉬는 일 하나만 하면 충분합니다.</p>
<p><b>지금의 마음에서 보면, </b>열심히 해 왔는데 앞으로 나아가지 않는 느낌이 들 때, 몸과 마음은 대개 이미 꽤 지쳐 있어요. 예를 들어 주말 내내 쉬었는데도 한 주를 시작하는 아침이 여전히 무겁게 느껴진다면, 생각보다 오래 버텨 왔다는 뜻일 수 있습니다. 지금 쉬고 싶은 마음은 게으름이 아니라 지친 나를 위한 정직한 신호예요.</p>
<p><b>나를 붙잡는 것에서 보면, </b>통제하려는 마음은 불안할수록 커져요. 예를 들어 일정이 하나만 바뀌어도 하루 전체가 틀어진 것처럼 느껴진다면, 그만큼 많은 걸 꽉 쥐고 있었다는 표시일 수 있습니다. 모든 걸 붙잡으려 할수록 작은 변화에도 쉽게 지치니, 오늘은 내 손 밖의 일 하나를 그대로 두어 보세요.</p>
<p><b>다음 한 걸음에서 보면, </b>나를 품어 주는 일은 거창하지 않아도 됩니다. 따뜻한 음료 한 잔, 일찍 눕는 저녁, 나에게 건네는 다정한 말 한마디처럼 몸과 마음이 &#x27;돌봄을 받았다&#x27;고 느끼는 순간이면 충분해요. 예를 들어 하루를 마친 뒤 따뜻한 물로 손을 천천히 씻으며 &#x27;오늘도 수고했어&#x27;라고 속으로 말해 주는 것만으로도 몸은 쉼을 알아차릴 수 있습니다.</p></div><div class="pay"><b>세 장의 이야기는 리포트에서 이어져요</b><p>세 장이 함께 들려주는 이야기와 곱씹어 볼 질문, 내 고민에 대어 본 해석, 해결의 흐름, 웰니스 처방과 이번 주 실천 카드까지 이어서 읽을 수 있어요.</p><p class="price">전체 리포트 1,900원</p><button class="btn fill do-pay">1,900원 결제하고 이어 읽기</button><small>미리보기에서는 누르면 결제 후 화면으로 바뀌어요</small></div></div><div class="navrow"><button class="btn line go-prev">돌아가기</button><button class="btn fill go-next">다음으로 →</button></div></div></section>
<section class="page" data-page="7"><header class="ph"><span class="no">7 / 10</span><h1>해결의 흐름</h1></header><div class="pbody"><p class="teaser">이 고민이 풀리는 속도와, 카드를 그렇게 읽은 이유</p><div class="lockwrap"><div class="blurred"><p class="sum"><b>한 걸음씩 풀어 가는 흐름이에요.</b></p>

<p><b>지금은 &#x27;회복 국면&#x27;입니다.</b> 해결책을 더 찾기보다 바닥난 힘을 먼저 채워야 다음 해결이 가능해지는 단계예요. 지금은 쉬는 것이 미루는 게 아니라 해결의 순서입니다.</p>

ss="kw"><span>#통제</span><span>#경직</span><span>#긴장</span><span>#혼자 짊어짐</span></p><p class="arc">원래 타로 카드 · 황제(The Emperor)</p></div><h3 class="storyhead">이 고민이 생기기까지, 나는 어떻게 해 왔을까?</h3><p><b>그동안 불안할 때마다 계획을 더 촘촘히 세우고 모든 걸 내 손으로 관리해 왔을 수 있어요.</b> 그 덕분에 일은 흐트러지지 않았지만, 몸과 마음은 늘 긴장한 채였습니다.</p>

이 순간</span></p><p class="arc">원래 타로 카드 · 태양(The Sun)</p></div><h3 class="storyhead">더 나은 앞으로를 위해, 무엇에 마음을 두면 될까?</h3><p><b>앞으로는 좋은 순간을 충분히 누리는 데 마음을 두세요.</b> 물개가 햇살 바위에서 쉬듯 기쁨을 느긋하게 즐기면 고민을 마주할 기운도 다시 채워집니다.</p>
<p>상대의 답보다 이 연락이 나에게 어떤 기쁨이었는지가 이 고민의 열쇠예요.</p>
<p>이제 세 장을 함께 읽어 볼까요?</p><div class="navrow"><button class="btn line go-prev">돌아가기</button><button class="btn fill go-next">세 장 함께 읽기 →</button></div></div></section>
<section class="page" data-page="5"><header class="ph"><span class="no">5 / 10</span><h1>세 장이 함께 들려주는 이야기</h1></header><div class="pbody"><h2 class="headline">되짚어 온 시간을 지나,<br>내가 누린 설렘 쪽으로</h2>
<p>지윤님의 마음은 멈춘 대화를 지나간 말들로 자꾸 되감으며, 답을 기다리는 시간을 길게 붙들고 있을 수 있어요.</p>
<p class="sum"><b>세 장은 불안을 붙잡아 온 날들에서 내 기쁨을 지키는 쪽으로 가는 길을 짚어 줘요.</b></p>
<p>그동안 불안할 때마다 계획을 더 세우고 모든 걸 붙잡아 왔을 수 있어요. 그 방식이 쌓여 이번에도 대화가 멈추자 마지막 말을 되짚으며 마음이 쉽게 흔들리고, 쉬어도 풀리지 않는 긴장이 이어지고 있습니다. 그래서 앞으로의 열쇠는 상대의 답을 붙잡는 힘보다, 이 설렘 속에서 나를 쉬게 하는 기쁨 쪽이 될 수 있습니다.</p>
<h3 class="sec">이 질문들을 곱씹어 볼까요?</h3>
<ul class="plain">
<li>그동안 답이 늦을 때마다 마지막에 보낸 말부터 떠올려 오지 않았나요?</li>
<li>혹시 지금 답 없는 대화창을 자꾸 열어 보고 있지는 않나요?</li>
<li>앞으로 상대의 답을 기다리는 쪽과 이 설렘을 나를 위해 누리는 쪽 중 어느 쪽에 더 마음을 두고 싶나요?</li>
</ul><div class="navrow"><button class="btn line go-prev">돌아가기</button><button class="btn fill go-next">다음으로 →</button></div></div></section>
<section class="page" data-page="6"><header class="ph"><span class="no">6 / 10</span><h1>내 고민에 대어 보면</h1></header><div class="pbody"><p class="sum"><b>이 고민은 메시지보다 내 마음의 바람과 두려움을 알아차릴 때 실마리가 보여요.</b></p>
<p>3주 동안 거의 매일 이어지던 연락이 이틀 전부터 멈췄다고 적어 주셨어요. 그동안 이런 순간마다 마지막에 보낸 말을 몇 번씩 되짚어 왔을 수 있어요. 그 되짚음이 이어지면서 답 없는 시간이 마음속에서 길어지고, 보낼지 말지 망설이는 마음이 커져 있는 듯합니다. 보낼지는 지윤님이 정할 일이고, 이 고민의 열쇠는 그 망설임 속 마음이 바람인지 두려움인지를 알아차리는 쪽이에요.</p><div class="navrow"><button class="btn line go-prev">돌아가기</button><button class="btn fill go-next">다음으로 →</button></div></div></section>
<section class="page" data-page="7"><header class="ph"><span class="no">7 / 10</span><h1>해결의 흐름</h1></header><div class="pbody"><p class="sum"><b>내 쪽의 실마리가 가까운 흐름이에요.</b></p>
<p>이 고민의 결과는 상대의 마음과 상황에 달려 있어, 카드가 그 답을 정해 주지는 않습니다. 다만 내 쪽의 흐름만 보면 실마리가 가까이 있고, 내 마음을 정리할 힘도 충분히 남아 있어요.</p>
<p>결과가 상대나 상황에 달린 고민이라, 흐름을 가르는 것은 결과보다 그 사이 내 마음이 어디에 머무느냐입니다.</p>
<h4>이렇게 읽은 이유</h4>
<ul class="plain">
<li>지나온 길의 ‘지키는 자리’는 힘이 안쪽에 머무는 쪽으로 나왔습니다. 그동안의 방식이 지금까지 무게로 남아 있어 출발이 조금 느릴 수 있어요.</li>
<li>앞으로의 열쇠 ‘햇살 바위’가 힘이 앞으로 흐르는 쪽으로 나왔어요. 흐름을 가장 크게 좌우하는 자리라, 속도를 앞당기는 쪽으로 읽었습니다.</li>
<li>세 장 중 두 장 이상이 역방향입니다. 힘이 안쪽에 머무는 자리가 많아, 바깥의 변화보다 안쪽 정리가 먼저인 흐름이에요.</li>
</ul>
<h4>속도를 늦출 수 있는 것</h4>
<p><b>쉬어도 풀리지 않는 피로를 대수롭지 않게 넘기는 것이 속도를 늦출 수 있어요.</b> 지친 채 혼자 버티는 시간이 길어져 작은 부탁도 버거워집니다.</p><div class="navrow"><button class="btn line go-prev">돌아가기</button><button class="btn fill go-next">다음으로 →</button></div></div></section>
<section class="page" data-page="8"><header class="ph"><span class="no">8 / 10</span><h1>그래서, 이렇게 해 보세요</h1></header><div class="pbody"><p>앞에서 읽은 내용에 바로 이어지는 처방 두 가지예요. 하나는 앞으로의 열쇠를 생활로 옮기는 방법, 하나는 7쪽에서 본 속도를 늦추는 것을 푸는 방법이에요.</p>
<p class="bridge">앞으로의 열쇠 ‘좋은 순간을 충분히 누리는 힘’을 생활로 옮기면</p>
<ul>
<li><b>좋은 순간에 1분 더 머물기</b></li>
<p>좋은 일이 있을 때 바로 다음 일로 넘어가지 말고, 그 순간에 1분 더 머물러 보세요. 좋은 순간을 충분히 누리는 데 마음을 두면, 기쁨이 채워 주는 기운으로 고민도 마주할 수 있어요.</p>
</ul>
<p class="bridge">속도를 늦추는 ‘풀리지 않는 피로를 넘기는 것’을 풀려면</p>
<ul>
<li><b>피로 신호 점수 적기</b></li>
<p>하루 두 번, 낮과 저녁에 피로를 1~5점으로 노트에 적어요. 4점 이상이면 하던 일을 멈추고 10분 쉬어요. 쉬어도 풀리지 않는 피로를 넘기면 혼자 버티는 시간이 길어지니, 점수로 적어 눈에 보이게 해요.</p>
</ul><div class="navrow"><button class="btn line go-prev">돌아가기</button><button class="btn fill go-next">다음으로 →</button></div></div></section>
<section class="page" data-page="9"><header class="ph"><span class="no">9 / 10</span><h1>이번 주 실천 카드</h1></header><div class="pbody"><p>8쪽 처방을 이번 주로 옮긴 작은 실천이에요. 오늘과 이번 주는 첫 번째 처방을, 3일 안에는 두 번째 처방을 작게 해 보는 거예요.</p>
<ul>
<li><b>오늘: 좋은 순간 1분 누리기 (1분)</b></li>
<p>오늘 좋았던 순간 하나를 떠올려, 그때의 기분을 1분 동안 천천히 다시 느껴 보세요. 좋은 순간을 1분만 누려도 기쁨이 몸에 남는 걸 느낄 수 있어요.</p>
</ul>
<ul>
<li><b>3일 안에: 피로 점수 보고 쉬기 (10분)</b></li>
<p>적어 둔 피로 점수가 높았던 시간을 찾아, 그 시간 뒤에 10분 쉬는 칸을 일정에 넣고 실제로 쉬어요. 풀리지 않는 피로를 점수로 확인하면 넘기기 어려워져서 지친 채 버티는 시간이 줄어요.</p>
</ul>
<ul>
<li><b>이번 주: 하루 한 번 좋은 순간 누리기 (이번 주)</b></li>
<p>이번 주 매일 좋았던 순간 하나를 고르고, 5분 동안 그 순간을 노트에 자세히 적어 보세요. 좋은 순간을 날마다 충분히 누리면 고민을 마주할 기운이 다시 채워져요.</p>
</ul>
<p>이 실천은 정답이 아니라 지윤님에게 맞는 방법을 찾는 작은 실험이에요. 해 보면서 마음에 걸린 장면이 생기면, 쏘웰라와 이어서 이야기해 볼 수 있어요.</p><div class="navrow"><button class="btn line go-prev">돌아가기</button><button class="btn fill go-next">다음으로 →</button></div></div></section>
<section class="page" data-page="10"><header class="ph"><span class="no">10 / 10</span><h1>쏘웰라와 이어서 이야기하기</h1></header><div class="pbody"><p>카드에서 마음에 걸린 문장이 있다면 쏘웰라에게 이어서 이야기해 보세요. 쏘웰라는 전문 상담사가 설계한 웰니스 대화예요. 타로를 보신 분들은 3일 동안 무료로 이용할 수 있어요. 지금의 계정 그대로 쏘웰라에 접속할 수 있으니 지금 바로 대화해 볼까요?</p>
<button class="btn fill go-next">쏘웰라 3일 무료로 시작하기</button><div class="navrow"><button class="btn line go-prev">돌아가기</button></div></div></section></template>
<script>
const rail = document.getElementById('rail'), dots = document.getElementById('dots'), lbl = document.getElementById('lbl');
const prev = document.getElementById('prev'), next = document.getElementById('next');
const LOCK = {unpaid:[6, 7, 8, 9, 10], paid:[]};
let mode = 'unpaid';
function pages(){ return [...rail.querySelectorAll('.page')]; }
function idx(){ return Math.round(rail.scrollLeft / rail.clientWidth); }
function draw(){
  const i = idx(), n = pages().length;
  dots.innerHTML = pages().map((p,k)=>`<i class="${k===i?'on':''} ${LOCK[mode].includes(k+1)?'lock':''}"></i>`).join('');
  lbl.textContent = `${i+1} / ${n}`; prev.disabled = i===0; next.disabled = i===n-1;
}
function go(k){ rail.scrollTo({left: k*rail.clientWidth}); }
prev.onclick = ()=>go(idx()-1); next.onclick = ()=>go(idx()+1);
rail.addEventListener('scroll', ()=>requestAnimationFrame(draw));
document.addEventListener('keydown', (e)=>{ if(e.key==='ArrowRight') go(idx()+1); if(e.key==='ArrowLeft') go(idx()-1); if(e.key==='Escape') zoom.classList.remove('on'); });
function setMode(m){
  const k = idx(); mode = m;
  rail.innerHTML = document.getElementById('tpl-'+m).innerHTML;
  document.querySelectorAll('.state button').forEach(b=>b.classList.toggle('on', b.dataset.m===m));
  bind(); requestAnimationFrame(()=>{ rail.scrollLeft = k*rail.clientWidth; draw(); });
}
const zoom = document.getElementById('zoom'), zimg = zoom.querySelector('img');
zoom.onclick = ()=>zoom.classList.remove('on');
function bind(){
  rail.querySelectorAll('.go-next').forEach(b=>b.onclick=()=>go(idx()+1));
  rail.querySelectorAll('.go-prev').forEach(b=>b.onclick=()=>go(idx()-1));
  rail.querySelectorAll('.do-pay').forEach(b=>b.onclick=()=>setMode('paid'));
  rail.querySelectorAll('[data-zoom]').forEach(f=>f.onclick=()=>{ zimg.src=f.querySelector('img').src; zimg.alt=f.querySelector('img').alt; zoom.classList.add('on'); });
}
document.querySelectorAll('.state button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
setMode('unpaid');
window.addEventListener('resize', ()=>go(idx()));
</script>
</body></html>
